name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install commitizen
        run: uv tool install commitizen

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version or recover missing tag
        id: bump
        run: |
          VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          TAG="v${VERSION}"
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            cz bump --yes || CZ_EXIT=$?
            CZ_EXIT=${CZ_EXIT:-0}
            if [ $CZ_EXIT -eq 21 ]; then
              echo "No eligible commits since ${TAG}. Skipping release."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ $CZ_EXIT -ne 0 ]; then
              exit $CZ_EXIT
            fi
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          else
            echo "Recovery: version ${VERSION} has no tag. Creating annotated tag ${TAG}."
            git tag -a "${TAG}" -m "chore: release ${TAG}"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push commit and tag
        if: steps.bump.outputs.skipped != 'true'
        run: git push origin main --follow-tags

      - name: Create GitHub Release
        if: steps.bump.outputs.skipped != 'true'
        run: |
          VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
