[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epub-content-extractor"
version = "0.2.3"
description = "Extract text and images from EPUB files and reconstruct as Markdown"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "HizZaniya" },
]
keywords = ["epub", "markdown", "mcp", "extraction", "ebook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = [
    "fastmcp>=3.3.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "typer>=0.12",
    "pillow>=11.0",
]

[project.urls]
Homepage = "https://github.com/HizZaniya/epub-content-extractor"
Repository = "https://github.com/HizZaniya/epub-content-extractor"
"Bug Tracker" = "https://github.com/HizZaniya/epub-content-extractor/issues"

[project.scripts]
epub-extract = "epub_content_extractor.__main__:main"
epub-content-extractor = "epub_content_extractor.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/epub_content_extractor"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["epub_content_extractor"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.ty.environment]
python-version = "3.13"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
annotated_tag = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "commitizen>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14",
    "pre-commit>=4.0",
    "ty>=0.0.38",
    "ruff>=0.15.14",
]
